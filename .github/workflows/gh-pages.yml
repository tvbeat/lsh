name: "Deploy docs to GitHub Pages"
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: install nix
      uses: cachix/install-nix-action@v31

    - name: gen-doc
      run: nix develop --command ldoc .

    - name: upload doc
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: deploy to github pages
      id: deployment
      uses: actions/deploy-pages@v5

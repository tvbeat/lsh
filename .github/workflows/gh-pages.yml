name: "Deploy docs to GitHub Pages"
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: install nix
      uses: cachix/install-nix-action@v31

    - name: build doc
      run: cp -r --no-preserve=mode "$(nix build .#doc --print-out-paths)/share/doc/lsh" ./doc

    - name: add commit and its timestamp to footer
      run: |
        date=$(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M:%S')
        commit="<a href=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\">${GITHUB_SHA::7}</a>"
        find doc -name '*.html' -exec sed -i "s|Last updated [^<]*</i>|Last updated $date UTC ($commit)</i>|" {} +

    - name: upload doc
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: deploy to github pages
      id: deployment
      uses: actions/deploy-pages@v5

name: "Build and Test"
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: install nix
      uses: cachix/install-nix-action@v31

    - name: check
      run: nix flake check -L
